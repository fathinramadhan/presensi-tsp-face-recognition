<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{
    background: linear-gradient(135deg,#f4f6f9,#e9ecef);
    min-height:100vh;
}


.container{
    margin-top:70px;
}


.card-presensi{

    background:white;
    padding:45px;
    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.12);

    text-align:center;

    max-width:600px;
    margin:auto;

}



.logo-box{

    width:120px;
    height:120px;

    margin:auto;
    margin-bottom:25px;

    display:flex;
    align-items:center;
    justify-content:center;

}


.logo{

    width:120px;
    height:auto;

    object-fit:contain;

}



h2{

    font-weight:700;
    color:#212529;

}


.subtitle{

    color:#6c757d;
    margin-bottom:35px;

}



.menu-presensi{

    display:flex;
    justify-content:center;
    gap:20px;

}



.btn-menu{

    width:200px;

    padding:15px;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    transition:.3s;

}



.btn-masuk{

    background:#198754;
    color:white !important;
    display:flex;
    align-items:center;
    justify-content:center;

}



.btn-masuk:hover{

    background:#146c43;
    color:white;
    transform:translateY(-5px);

}

.menu-presensi a{
    text-decoration:none;
    color:white;
}


.btn-pulang{

    background:#dc3545;
    color:white !important;
    display:flex;
    align-items:center;
    justify-content:center;

}



.btn-pulang:hover{

    background:#b02a37;
    transform:translateY(-5px);

}



.btn-kembali{

    margin-top:35px;

    padding:10px 25px;

    border-radius:10px;

}



.status{

    margin-top:30px;

    padding:12px;

    background:#f8f9fa;

    border-radius:10px;

    color:#6c757d;

}



@media(max-width:600px){

.menu-presensi{

    flex-direction:column;

}

.btn-menu{

    width:100%;

}

}


</style>

</head>


<body>


<div class="container">


<div class="card-presensi">


<div class="logo-box">

    <img src="/static/images/Logo_TheSoundsProject.png" class="logo">

</div>



<h2>
Presensi Karyawan
</h2>


<p class="subtitle">
Gunakan kamera untuk melakukan presensi wajah
</p>



<div class="menu-presensi">


<a href="/presensi_masuk">

<a href="/presensi_masuk" class="btn btn-menu btn-masuk">
    Presensi Masuk
</a>

</a>



<a href="/presensi_pulang">

<a href="/presensi_pulang" class="btn btn-menu btn-pulang">
    Presensi Pulang
</a>

</a>



</div>




<div class="status">

Face Recognition System



Siap melakukan identifikasi wajah

</div>




<a href="/dashboard">

<button class="btn btn-secondary btn-kembali">

Kembali

</button>

</a>



</div>


</div>


</body>

</html>
