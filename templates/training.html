<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Wajah</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{

    background:linear-gradient(135deg,#f4f6f9,#e9ecef);

    min-height:100vh;

}


.container{

    margin-top:70px;

}



.card-training{

    background:white;

    max-width:600px;

    margin:auto;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,0.12);

}



/* Logo */

.logo-box{

    width:120px;

    height:120px;

    margin:auto;

    margin-bottom:20px;

}



.logo{

    width:120px;

    height:auto;

    object-fit:contain;

}



/* Judul */

h2{

    font-weight:700;

    color:#212529;

}



.subtitle{

    color:#6c757d;

    margin-bottom:30px;

}



/* Status */

.status-ready{

    background:#d1e7dd;

    color:#146c43;

    padding:12px;

    border-radius:10px;

    margin-bottom:25px;

}



.status-empty{

    background:#f8d7da;

    color:#842029;

    padding:12px;

    border-radius:10px;

    margin-bottom:25px;

}



/* Tombol */

.btn-training{

    width:250px;

    padding:14px;

    border-radius:12px;

    font-size:16px;

    margin:8px;

}



</style>

</head>


<body>


<div class="container">


<div class="card-training">



<div class="logo-box">

<img src="/static/images/Logo_TheSoundsProject.png" class="logo">

</div>



<h2>
Training Wajah
</h2>


<p class="subtitle">
Melakukan pembaruan model pengenalan wajah
</p>






{% if model_ready %}

<div class="status-ready">

Model wajah tersedia

<br><br>

{% if total_wajah %}

Training selesai. Total wajah yang dilatih :
<b>{{ total_wajah }}</b>

{% else %}

Total wajah yang dilatih : 0

{% endif %}

</div>


{% else %}


<div class="status-empty">

Model wajah belum dibuat

</div>


{% endif %}





<a href="/proses_training">

<button class="btn btn-primary btn-training">

Mulai Training

</button>

</a>



<br>



<a href="/dashboard">

<button class="btn btn-secondary btn-training">

Kembali Dashboard

</button>

</a>



</div>


</div>


</body>

</html>
