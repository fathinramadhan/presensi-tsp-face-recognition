<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Karyawan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">



<style>

body{
    background:linear-gradient(135deg,#f4f6f9,#e9ecef);
    min-height:100vh;
}


.container{

    margin-top:50px;

}

.card-form{

    background:white;

    max-width:600px;

    margin:50px auto;

    padding:35px;

    border-radius:20px;

    box-shadow:0 8px 25px rgba(0,0,0,.08);

}



.logo{

    width:120px;

    height:auto;

    display:block;

    margin:0 auto 20px;

}



h2{

    text-align:center;

    font-weight:700;

    margin-bottom:30px;

}



.form-control{

    border-radius:10px;

}



.btn{

    border-radius:10px;

    padding:10px 25px;

}


</style>

</head>



<body>


<div class="card-form">



<img src="/static/images/Logo_TheSoundsProject.png" class="logo">



<h2>
Edit Data Karyawan
</h2>



<form method="POST" enctype="multipart/form-data">

<label class="form-label">
Nama
</label>

<input
type="text"
name="nama"
class="form-control"
value="{{ data.nama }}"
required
>



<br>


<label class="form-label">
Jabatan
</label>

<input
type="text"
name="jabatan"
class="form-control"
value="{{ data.jabatan }}"
required
>



<br>


<label class="form-label">
Divisi
</label>

<input
type="text"
name="divisi"
class="form-control"
value="{{ data.divisi }}"
required
>

<br>

<label class="form-label">
No HP
</label>

<input
type="text"
name="no_hp"
class="form-control"
value="{{ data.no_hp }}"
required
>


<br>

<label class="form-label">
Email
</label>

<input
type="email"
name="email"
class="form-control"
value="{{ data.email }}"
required
>
<br>

<label class="form-label">
Foto Profile
</label>

<input
type="file"
name="foto"
class="form-control"
accept="image/*"
>

<br>



<div class="text-center">


<button type="submit" class="btn btn-primary">

Simpan Perubahan

</button>



<a href="/karyawan" class="btn btn-secondary">

Batal

</a>


</div>



</form>


</div>


</div>


</body>

</html>
