<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

body{

    background-image:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.55)
    ),
    url('/static/images/background.jpg');

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    min-height:100vh;

}


.login-card{

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.12);

}


.logo{

    width:140px;

    display:block;

    margin:0 auto 20px;

}


h3{

    font-weight:700;

}


.form-control{

    border-radius:10px;

}


.btn-login{

    border-radius:10px;

    padding:10px;

    font-weight:600;

}

</style>
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-4">

            <div class="login-card">

<img src="/static/images/Logo_TheSoundsProject.png" class="logo">

<div class="text-center">
    <h3>Login Admin</h3>
</div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label>Username</label>
                            <input
    type="text"
    class="form-control"
    name="username"
    required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input
    type="password"
    class="form-control"
    name="password"
    required>
                        </div>

                        <button class="btn btn-primary w-100 btn-login">
                            Login
                        </button>

                    </form>

                </div> <!-- tutup login-card -->

        </div> <!-- col -->

    </div> <!-- row -->

</div> <!-- container -->

</body>
</html>
